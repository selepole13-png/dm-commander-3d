    const BABYLON = window.BABYLON;
    const canvas = document.getElementById('renderCanvas');

    // Import your bundled app (which exports createScene / default)
    const mod = await import(url);

    let engine = null;
    if (typeof mod.createEngine === 'function') {
      try { engine = await mod.createEngine(); } catch {}
    }
    if (!engine) {
      engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    }
    window.engine = engine; window.canvas = canvas;

    let createScene = mod.createScene || mod.default;
    if (!createScene && mod.Playground?.CreateScene) createScene = (e,c)=>mod.Playground.CreateScene(e,c);
    if (!createScene) throw new Error('No createScene() export found.');

    const scene = await (createScene(engine, canvas) ?? createScene());

    // DM Commander 3D - Interfaccia iPad V16
    // Riordina soltanto i controlli GUI, senza modificare il combattimento.
    function findControl(name) {
      for (const texture of scene.textures) {
        if (typeof texture.getControlByName === 'function') {
          const control = texture.getControlByName(name);
          if (control) return control;
        }
      }
      return null;
    }
    function place(name, settings) {
      const control = findControl(name);
      if (control) Object.assign(control, settings);
    }
    const GUI = BABYLON.GUI.Control;
    function layoutCommander() {
      const narrow = window.innerWidth < 700;
      const w = narrow ? '92px' : '110px';
      const h = narrow ? '36px' : '42px';
      const right = narrow ? '-7px' : '-14px';
      place('title', {fontSize: narrow ? 13 : 17, height:'38px'});
      [
        ['dice toggle', 48],
        ['sheet toggle', 92],
        ['editor toggle', 136]
      ].forEach(([name, top]) => place(name, {
        width:w, height:h, left:right, top:top+'px',
        horizontalAlignment:GUI.HORIZONTAL_ALIGNMENT_RIGHT,
        verticalAlignment:GUI.VERTICAL_ALIGNMENT_TOP
      }));
      place('turn panel', {
        width: narrow ? '195px' : '245px',
        height: narrow ? '92px' : '108px',
        left: narrow ? '7px' : '14px', top:'48px'
      });
      place('turn info', {fontSize:narrow ? 12 : 14});
      place('save panel', {top:narrow ? '150px':'170px',left:'8px',width:narrow?'135px':'165px'});
      place('grid toggle', {
        width:narrow?'120px':'150px', height:h,
        left:'-8px',top:'-12px',
        horizontalAlignment:GUI.HORIZONTAL_ALIGNMENT_LEFT,
        verticalAlignment:GUI.VERTICAL_ALIGNMENT_BOTTOM
      });
      place('next turn', {
        width:narrow?'125px':'145px',height:h,
        left:'-8px',top:'-12px',
        horizontalAlignment:GUI.HORIZONTAL_ALIGNMENT_RIGHT,
        verticalAlignment:GUI.VERTICAL_ALIGNMENT_BOTTOM
      });
      place('attack button', {
        width:narrow?'125px':'145px',height:h,
        left:'-8px',top:narrow?'-56px':'-64px',
        horizontalAlignment:GUI.HORIZONTAL_ALIGNMENT_RIGHT,
        verticalAlignment:GUI.VERTICAL_ALIGNMENT_BOTTOM
      });
      for (const name of ['dice panel','character sheet panel','editor panel']) {
        const control=findControl(name);
        if (control && narrow) control.scaleX=control.scaleY=.78;
        else if(control) control.scaleX=control.scaleY=1;
      }
    }
    layoutCommander();
    window.addEventListener('resize', layoutCommander);

    engine.runRenderLoop(()=>scene.render());
    addEventListener('resize', ()=>engine.resize());

    addEventListener('unload', ()=> URL.revokeObjectURL(url));
